services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: malefikeep
      POSTGRES_USER: malefikeep
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malefikeep -d malefikeep"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/malefikeep
      DB_USER: malefikeep
      DB_PASSWORD: changeme
      JWT_SECRET: changeme
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
